name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  release:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v2

    - name: Action For Semantic Release
      uses: cycjimmy/semantic-release-action@v2.4.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
